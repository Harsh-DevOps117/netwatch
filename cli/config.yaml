window_seconds: 10

rules:
  port_scan:
    enabled: true
    unique_ports: 20

  host_scan:
    enabled: true
    unique_hosts: 20

  syn_flood:
    enabled: true
    syn_per_second: 500
    syn_ack_ratio: 5.0
    min_syn_count: 50

  ack_flood:
    enabled: true
    ack_per_second: 1000

  udp_flood:
    enabled: true
    udp_packets_per_second: 1000

  connection_burst:
    enabled: true
    syn_per_second: 500

  suspicious_flags:
    enabled: true
