<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#999999;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Radiating structure from center -->
  <g transform="translate(300, 300)">
    <!-- Background glow circle -->
    <circle r="250" fill="url(#centerGlow)" opacity="0.2"/>
    
    <!-- Radiating lines - 24 rays for full coverage -->
    <!-- Primary rays (12) - thicker -->
    <line x1="0" y1="0" x2="0" y2="-250" stroke="#333333" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="217" y2="-125" stroke="#666666" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="250" y2="0" stroke="#999999" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="217" y2="125" stroke="#333333" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#666666" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="-217" y2="125" stroke="#999999" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="-250" y2="0" stroke="#333333" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="-217" y2="-125" stroke="#666666" stroke-width="3" opacity="0.6"/>
    
    <line x1="0" y1="0" x2="125" y2="-217" stroke="#333333" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="125" y2="217" stroke="#666666" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="0" x2="-125" y2="217" stroke="#999999" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="-125" y2="-217" stroke="#333333" stroke-width="3" opacity="0.6"/>
    
    <!-- Secondary rays (12) - thinner, between primary rays -->
    <line x1="0" y1="0" x2="65" y2="-240" stroke="#333333" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="180" y2="-180" stroke="#666666" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="240" y2="-65" stroke="#999999" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="240" y2="65" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="180" y2="180" stroke="#666666" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="65" y2="240" stroke="#999999" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-65" y2="240" stroke="#333333" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="-180" y2="180" stroke="#666666" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-240" y2="65" stroke="#999999" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="-240" y2="-65" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-180" y2="-180" stroke="#666666" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="-65" y2="-240" stroke="#999999" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Concentric rings to show expansion -->
    <circle r="80" fill="none" stroke="#333333" stroke-width="2" opacity="0.3"/>
    <circle r="140" fill="none" stroke="#666666" stroke-width="1.5" opacity="0.3"/>
    <circle r="200" fill="none" stroke="#999999" stroke-width="1" opacity="0.3"/>
    
    <!-- Energy particles along rays (static positions) -->
    <circle cx="0" cy="-180" r="4" fill="#000000" opacity="0.6"/>
    <circle cx="156" cy="-90" r="4" fill="#000000" opacity="0.5"/>
    <circle cx="180" cy="0" r="4" fill="#000000" opacity="0.6"/>
    <circle cx="0" cy="180" r="4" fill="#000000" opacity="0.5"/>
    <circle cx="-156" cy="90" r="4" fill="#000000" opacity="0.6"/>
    <circle cx="-180" cy="0" r="4" fill="#000000" opacity="0.5"/>
    
    <!-- Central power core -->
    <circle r="50" fill="url(#centerGlow)"/>
    <circle r="30" fill="#333333" opacity="0.8"/>
    <circle r="20" fill="#666666"/>
    <circle r="10" fill="#000000"/>
  </g>
</svg>