<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">The compressor</title>
  <desc id="d">The compressor reads s, the 100-number context of each event from the frozen forecasting encoder, puts it on a benign scale fitted once on 200,000 benign training events, and passes it through an autoencoder: LayerNorm, Linear 100 to 128, ReLU, Linear 128 to 32 gives z; The decoder, Linear 32 to 128, ReLU, Linear 128 to 100, rebuilds s. Each event is encoded on its own, in batches of 512 events in availability order. It is trained on benign events only to minimise the mean squared rebuild error; The best epoch has the lowest validation loss. It writes z, which the world model reads, and the reconstruction error, which is for reports only and is never an input to the world model.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="24%" cy="10%" r="55%"><stop offset="0%" stop-color="#e54d5e" stop-opacity="0.10"/><stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.05"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <path id="ae" d="M372,196 L482,184 L602,214 L712,184 L822,196"/>
  </defs>

  <rect width="1200" height="560" fill="#0b0e14"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <text x="28" y="40" fill="#e6edf3" font-size="20" font-weight="700">Compressor</text>
  <text x="28" y="62" fill="#8b949e" font-size="13">squeezes each event's context s (100 numbers) into z (32) for the world model, and measures how unlike benign traffic that context is</text>

  <!-- ===================== input ===================== -->
  <rect x="20" y="80" width="280" height="460" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="34" y="102" fill="#bc8cff" font-size="13" font-weight="700">INPUT  s · 100</text>
  <text x="34" y="122" fill="#8b949e" font-size="11">from the forecasting encoder, frozen</text>
  <g stroke="#bc8cff" stroke-opacity="0.6">
    <rect x="34" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.55"/><rect x="59" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.25"/>
    <rect x="84" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.7"/><rect x="109" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.35"/>
    <rect x="134" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.5"/><rect x="159" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.2"/>
    <rect x="184" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.6"/><rect x="209" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.4"/>
    <rect x="234" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.3"/><rect x="259" y="134" width="25" height="22" fill="#6e40c9" fill-opacity="0.65"/>
  </g>
  <g font-size="11" fill="#e6edf3">
    <text x="34" y="178">s already holds the link's memory and the</text>
    <text x="34" y="192">attention over up to 20 neighbours, so z is</text>
    <text x="34" y="206">this event in the light of its history.</text>
    <text x="34" y="220" fill="#8b949e">It never holds a later event.</text>
  </g>

  <text x="34" y="252" fill="#8b949e" font-size="13" font-weight="700">BENIGN SCALE</text>
  <rect x="34" y="262" width="252" height="34" rx="6" fill="#0b0e14" stroke="#6e7681"/>
  <text x="160" y="284" fill="#e6edf3" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">s̃ = (s − μ) / σ</text>
  <g font-size="11" fill="#8b949e">
    <text x="34" y="314">μ, σ per column, fitted once before training on</text>
    <text x="34" y="328">200,000 benign training events of the first day;</text>
    <text x="34" y="342">kept in the checkpoint, so scoring uses the same scale</text>
  </g>

  <text x="34" y="374" fill="#8b949e" font-size="13" font-weight="700">BATCHES OF 512 EVENTS</text>
  <g>
    <rect x="34" y="384" width="60" height="18" rx="3" fill="#0b3036" stroke="#39c5bb"/><rect x="98" y="384" width="60" height="18" rx="3" fill="#0b3036" stroke="#39c5bb"/>
    <rect x="162" y="384" width="60" height="18" rx="3" fill="#0b3036" stroke="#39c5bb"/><rect x="226" y="384" width="60" height="18" rx="3" fill="#0b3036" stroke="#39c5bb" stroke-dasharray="3 2"/>
    <path d="M34,412 L276,412" stroke="#6e7681" marker-end="url(#ah)"/>
    <text x="34" y="428" fill="#8b949e" font-size="10">t_obs order</text>
  </g>
  <g font-size="11" fill="#e6edf3">
    <text x="34" y="452">each row is encoded on its own: no event</text>
    <text x="34" y="466">reads another event inside the compressor</text>
  </g>
  <text x="34" y="498" fill="#8b949e" font-size="13" font-weight="700">SIZE</text>
  <text x="34" y="518" fill="#e6edf3" font-size="11">≈ 34k weights · no gradient reaches the context encoder</text>

  <!-- ===================== autoencoder ===================== -->
  <rect x="320" y="80" width="560" height="300" rx="12" fill="#0b3036" fill-opacity="0.35" stroke="#39c5bb" stroke-opacity="0.5"/>
  <text x="334" y="102" fill="#39c5bb" font-size="13" font-weight="700">THE AUTOENCODER · one event at a time</text>

  <!-- connectors -->
  <path d="M384,155 L470,140 L470,310 L384,295 Z" fill="#39c5bb" fill-opacity="0.10" stroke="#39c5bb" stroke-opacity="0.5"/>
  <path d="M494,140 L590,203 L590,247 L494,310 Z" fill="#39c5bb" fill-opacity="0.10" stroke="#39c5bb" stroke-opacity="0.5"/>
  <path d="M614,203 L700,140 L700,310 L614,247 Z" fill="#39c5bb" fill-opacity="0.05" stroke="#39c5bb" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <path d="M724,140 L810,155 L810,295 L724,310 Z" fill="#39c5bb" fill-opacity="0.05" stroke="#39c5bb" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <g font-size="9.5" fill="#e6edf3" text-anchor="middle">
    <text x="427" y="212">LayerNorm</text><text x="427" y="226">Linear</text><text x="427" y="240">ReLU</text>
    <text x="542" y="229">Linear</text>
    <text x="657" y="219">Linear</text><text x="657" y="233">ReLU</text>
    <text x="767" y="229">Linear</text>
  </g>

  <!-- layers as bars, height ∝ width -->
  <rect x="360" y="155" width="24" height="140" rx="3" fill="#2a1a45" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="470" y="140" width="24" height="170" rx="3" fill="#0b3036" stroke="#39c5bb" stroke-width="1.5"/>
  <rect x="590" y="203" width="24" height="44" rx="3" fill="#39c5bb" fill-opacity="0.35" stroke="#39c5bb" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="140" width="24" height="170" rx="3" fill="#0b3036" stroke="#39c5bb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="810" y="155" width="24" height="140" rx="3" fill="#2a1a45" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle r="4" fill="#39c5bb"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#ae"/></animateMotion></circle>

  <g text-anchor="middle" font-weight="700" font-size="13">
    <text x="372" y="146" fill="#d2a8ff">s̃</text>
    <text x="482" y="131" fill="#39c5bb" font-size="11">hidden</text>
    <text x="602" y="194" fill="#39c5bb">z</text>
    <text x="712" y="131" fill="#39c5bb" font-size="11">hidden</text>
    <text x="822" y="146" fill="#d2a8ff">ŝ</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="372" y="310">100</text><text x="482" y="325">128</text><text x="602" y="262">32</text><text x="712" y="325">128</text><text x="822" y="310">100</text>
  </g>

  <!-- brackets -->
  <g stroke="#39c5bb" stroke-width="1.3" fill="none">
    <path d="M360,336 L360,342 L608,342 L608,336"/>
    <path d="M620,336 L620,342 L834,342 L834,336" stroke-dasharray="4 3"/>
  </g>
  <text x="484" y="362" fill="#39c5bb" font-size="11.5" text-anchor="middle">encoder · 100 → 128 → 32</text>
  <text x="727" y="362" fill="#39c5bb" font-size="11.5" text-anchor="middle">decoder · 32 → 128 → 100</text>

  <!-- ===================== training ===================== -->
  <rect x="900" y="80" width="280" height="300" rx="12" fill="#3a1215" stroke="#ff7b72" stroke-dasharray="5 4"/>
  <text x="914" y="102" fill="#ff7b72" font-size="13" font-weight="700">TRAINING · benign events only</text>
  <g font-size="11.5" fill="#e6edf3">
    <text x="914" y="128">target: s̃ itself — rebuild the context</text>
    <text x="914" y="148">loss = mean over 100 columns of (ŝ − s̃)²</text>
    <text x="914" y="176">benign events of the training split,</text>
    <text x="914" y="192">every training day</text>
    <text x="914" y="212">Adam · learning rate 10⁻³ · 5 epochs</text>
    <text x="914" y="232">best epoch: lowest validation loss</text>
    <text x="914" y="248" fill="#8b949e" font-size="11">(benign events of the validation split)</text>
  </g>
  <g font-size="11" fill="#ffa198">
    <text x="914" y="280">Why this works as a detector signal:</text>
    <text x="914" y="296">it only ever learned to rebuild benign</text>
    <text x="914" y="312">contexts, so an unusual one comes back</text>
    <text x="914" y="328">with a larger error.</text>
  </g>
  <text x="914" y="356" fill="#8b949e" font-size="10.5">saves best.pt, every epoch, history.csv,</text>
  <text x="914" y="370" fill="#8b949e" font-size="10.5">best_metrics.csv (train / validation / test)</text>

  <!-- ===================== output ===================== -->
  <rect x="320" y="400" width="860" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="334" y="422" fill="#e6edf3" font-size="13" font-weight="700">OUTPUT · event_latents.parquet</text>

  <path d="M602,266 L602,332 M602,350 L602,442" stroke="#3fb950" stroke-width="1.8" fill="none" marker-end="url(#ahg)"/>
  <rect x="334" y="444" width="416" height="84" rx="10" fill="#0f2d19" stroke="#3fb950"/>
  <text x="348" y="466" fill="#3fb950" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">z · 32  → world model</text>
  <text x="348" y="486" fill="#e6edf3" font-size="11.5">the event's latent: what the world model's memory update reads,</text>
  <text x="348" y="502" fill="#e6edf3" font-size="11.5">with the event's times, sender and receiver</text>
  <text x="348" y="518" fill="#8b949e" font-size="11">label, attack and role columns are for evaluation only</text>

  <rect x="764" y="444" width="402" height="84" rx="10" fill="#21262d" stroke="#6e7681"/>
  <text x="778" y="466" fill="#e6edf3" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">recon_error · 1</text>
  <text x="778" y="486" fill="#e6edf3" font-size="11.5">mean (ŝ − s̃)²: low means the context looks benign</text>
  <text x="778" y="502" fill="#e6edf3" font-size="11.5">for reports and checks only</text>
  <text x="778" y="518" fill="#8b949e" font-size="11">never a world-model input: a score, not an observation</text>
</svg>
