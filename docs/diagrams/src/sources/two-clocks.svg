<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">Two times per event, and processing in availability order</title>
  <desc id="d">Flow A's first packet arrives at 0 milliseconds and it is still running at 10 milliseconds, so its event becomes available at 10 milliseconds. Flow B starts at 5 milliseconds and ends at 6 milliseconds, so its event becomes available at 6 milliseconds. A moving cursor shows time passing: packets appear as they arrive, B is processed at 6 milliseconds, before A, and A is processed at 10 milliseconds with B already in memory. When B is processed, A's packets after 6 milliseconds do not exist yet.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="24%" cy="10%" r="55%"><stop offset="0%" stop-color="#e54d5e" stop-opacity="0.10"/><stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.05"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#0b0e14"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <rect width="1200" height="430" fill="url(#glow)"/>
  <text x="28" y="40" fill="#e6edf3" font-size="20" font-weight="700">Two times per event</text>
  <text x="28" y="62" fill="#8b949e" font-size="13">t = first packet · t_obs = min(t + 10 ms, flow end) = when the event becomes available — and the order the stream is processed in</text>

  <!-- axis: x = 120 + 80 * ms -->
  <line x1="120" y1="330" x2="1110" y2="330" stroke="#6e7681" stroke-width="1.5" marker-end="url(#ah)"/>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <line x1="120" y1="325" x2="120" y2="335" stroke="#6e7681"/><text x="120" y="350" fill="#e6edf3">0 ms</text>
    <line x1="520" y1="325" x2="520" y2="335" stroke="#6e7681"/><text x="520" y="350" fill="#e6edf3">5 ms</text>
    <line x1="600" y1="325" x2="600" y2="335" stroke="#6e7681"/><text x="600" y="350" fill="#e6edf3">6 ms</text>
    <line x1="920" y1="325" x2="920" y2="335" stroke="#6e7681"/><text x="920" y="350" fill="#e6edf3">10 ms</text>
  </g>
  <text x="1112" y="350" fill="#8b949e" font-size="11">time</text>

  <!-- lane labels -->
  <text x="28" y="134" fill="#58a6ff" font-size="14" font-weight="700">flow A</text>
  <text x="28" y="150" fill="#8b949e" font-size="11">event_id 1</text>
  <text x="28" y="234" fill="#f0883e" font-size="14" font-weight="700">flow B</text>
  <text x="28" y="250" fill="#8b949e" font-size="11">event_id 2</text>

  <!-- A's 10 ms observation window -->
  <rect x="120" y="112" width="800" height="36" rx="6" fill="#0d2545" stroke="#58a6ff" stroke-opacity="0.5"/>
  <text x="130" y="106" fill="#58a6ff" font-size="11">A's first 10 ms — what the flow encoder sees for A</text>
  <line x1="920" y1="104" x2="920" y2="300" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="926" y="176" fill="#58a6ff" font-weight="700">t_obs(A) = 10 ms</text>
  <text x="926" y="192" fill="#8b949e" font-size="11">A still running: available now</text>

  <!-- B window -->
  <rect x="520" y="212" width="80" height="36" rx="6" fill="#3b1f0b" stroke="#f0883e" stroke-opacity="0.6"/>
  <line x1="600" y1="204" x2="600" y2="300" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="606" y="276" fill="#f0883e" font-weight="700">t_obs(B) = 6 ms</text>
  <text x="606" y="292" fill="#8b949e" font-size="11">B ended at 6 ms: available at once</text>

  <!-- packets appear as the cursor passes (cycle 10 s; now(ms) = 12 * (f - 0.05) / 0.85) -->
  <g fill="#58a6ff">
    <circle cx="120" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.05;0.055;0.95;1"/></circle>
    <circle cx="216" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.135;0.14;0.95;1"/></circle>
    <circle cx="368" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.27;0.275;0.95;1"/></circle>
    <circle cx="568" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.447;0.452;0.95;1"/></circle>
    <circle cx="784" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.638;0.643;0.95;1"/></circle>
    <circle cx="896" cy="130" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.737;0.742;0.95;1"/></circle>
  </g>
  <circle cx="1016" cy="130" r="7" fill="#0b0e14" stroke="#58a6ff" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.843;0.848;0.95;1"/></circle>
  <text x="1030" y="120" fill="#8b949e" font-size="10">later packets:</text>
  <text x="1030" y="133" fill="#8b949e" font-size="10">not in A's decision</text>
  <g fill="#f0883e">
    <circle cx="520" cy="230" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.404;0.409;0.95;1"/></circle>
    <circle cx="560" cy="230" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.44;0.445;0.95;1"/></circle>
    <circle cx="600" cy="230" r="7" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.475;0.48;0.95;1"/></circle>
  </g>

  <!-- processing callouts -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.475;0.49;0.95;1"/>
    <rect x="300" y="372" width="420" height="44" rx="8" fill="#3b1f0b" stroke="#f0883e"/>
    <text x="312" y="390" fill="#ffa657" font-weight="700">① B is processed first (6 ms)</text>
    <text x="312" y="406" fill="#e6edf3" font-size="11">memory holds only what existed by 6 ms — A's later packets don't exist yet</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.758;0.772;0.95;1"/>
    <rect x="740" y="372" width="440" height="44" rx="8" fill="#0d2545" stroke="#58a6ff"/>
    <text x="752" y="390" fill="#79c0ff" font-weight="700">② then A (10 ms)</text>
    <text x="752" y="406" fill="#e6edf3" font-size="11">B already in memory: it existed at 6 ms · event ids are only labels</text>
  </g>

  <!-- now cursor -->
  <g>
    <line x1="120" y1="96" x2="120" y2="336" stroke="#e6edf3" stroke-width="2"/>
    <rect x="102" y="80" width="36" height="16" rx="4" fill="#e6edf3"/>
    <text x="120" y="92" fill="#0b0e14" font-size="10" text-anchor="middle">now</text>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
                      values="0,0;0,0;960,0;960,0" keyTimes="0;0.05;0.9;1"/>
  </g>
</svg>
