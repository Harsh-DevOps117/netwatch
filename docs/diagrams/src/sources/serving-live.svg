  <text x="689" y="394" fill="#bc8cff" font-size="12.5" text-anchor="middle" font-weight="700">encoders</text>
  <text x="689" y="411" fill="#8b949e" font-size="10.5" text-anchor="middle">flow · context · compressor</text>
  <path d="M584,398 L602,398" fill="none" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#ah_bc8cff)"/>
  <rect x="796" y="372" width="170" height="52" rx="8" fill="#0b0e14" stroke="#3fb950" stroke-width="1.4"/>
