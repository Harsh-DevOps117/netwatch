  <text x="880.0" y="172" fill="#8b949e" font-size="10.5" text-anchor="middle">30 s</text>
  <rect x="914" y="150" width="60" height="34" rx="5" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4"/>
