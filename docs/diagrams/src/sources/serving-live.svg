<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">Lag forecast service (tag lag)</title>
  <desc id="d">A capture writes a file every 30 seconds. Each cycle merges the latest 16 files, eight minutes, into one capture and ingests it with the training code. Flows that start in the first or last 120 seconds are dropped, because they may have begun before the window or may still be open; the rest are final, the same flows a whole-day ingest produces. The encoders, compressor and world model then run and answer GET /forecast. The state describes the network as of the newest packet minus 120 seconds, about 121 to 152 seconds ago, refreshed every 30 seconds.</desc>
