  <text x="1008.0" y="172" fill="#8b949e" font-size="10.5" text-anchor="middle">30 s</text>
  <rect x="1042" y="150" width="60" height="34" rx="5" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1072.0" y="172" fill="#8b949e" font-size="10.5" text-anchor="middle">30 s</text>
  <rect x="1042" y="150" width="60" height="34" rx="5" fill="none" stroke="#e6edf3" stroke-width="2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></rect>
  <text x="1072.0" y="140" fill="#e6edf3" font-size="10.5" text-anchor="middle">newest file</text>
  <path d="M80,122 L80,116 L1104,116 L1104,122" fill="none" stroke="#8b949e"/>
  <text x="592" y="108" fill="#e6edf3" font-size="11.5" text-anchor="middle">window: the latest 16 files (8 min); every packet is parsed once, and one CICFlowMeter reads all files as one stream</text>
  <path d="M80,196 L80,202 L336,202 L336,196" fill="none" stroke="#8b949e"/>
  <text x="208.0" y="218" fill="#8b949e" font-size="10.5" text-anchor="middle">first 120 s: a flow may have begun before the window</text>
  <path d="M848,196 L848,202 L1104,202 L1104,196" fill="none" stroke="#8b949e"/>
  <text x="976.0" y="218" fill="#8b949e" font-size="10.5" text-anchor="middle">last 120 s: a flow may still be open</text>
  <path d="M336,196 L336,202 L848,202 L848,196" fill="none" stroke="#3fb950"/>
  <text x="592" y="218" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="700">complete flows: final, identical to a whole-day ingest</text>
  <line x1="1104" y1="240" x2="1104" y2="268" stroke="#e6edf3"/>
  <text x="1104" y="284" fill="#e6edf3" font-size="10.5" text-anchor="middle">newest packet</text>
  <line x1="848" y1="240" x2="848" y2="268" stroke="#7ee787" stroke-width="2"/>
  <text x="848" y="284" fill="#7ee787" font-size="11" text-anchor="middle" font-weight="700">state_as_of = newest − 120 s</text>
  <path d="M1100,254 L854,254" fill="none" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ah_7ee787)"/>
  <text x="1126.0" y="256" fill="#e6edf3" font-size="1" text-anchor="start"></text>
  <text x="28" y="316" fill="#e6edf3" font-size="11.5" text-anchor="start">How old the answer is: the newest packet is up to one file (30 s) old when that file closes, the hold is 120 s, and a cycle takes some seconds,</text>
  <text x="28" y="333" fill="#e6edf3" font-size="11.5" text-anchor="start">so the forecast shows the network about 121–152 s ago, refreshed every 30 s. The payload says so: source.state_as_of, source.lag_seconds.</text>
  <rect x="28" y="372" width="170" height="52" rx="8" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4"/>
  <text x="113" y="394" fill="#8b949e" font-size="12.5" text-anchor="middle" font-weight="700">parse the new file</text>
  <text x="113" y="411" fill="#8b949e" font-size="10.5" text-anchor="middle">tshark, once per file</text>
  <rect x="220" y="372" width="170" height="52" rx="8" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4"/>
  <text x="305" y="394" fill="#8b949e" font-size="12.5" text-anchor="middle" font-weight="700">flow stream</text>
  <text x="305" y="411" fill="#8b949e" font-size="10.5" text-anchor="middle">one CICFlowMeter, continuous</text>
