  <rect x="988" y="372" width="170" height="52" rx="8" fill="#0b0e14" stroke="#7ee787" stroke-width="1.4"/>
  <text x="1073" y="394" fill="#7ee787" font-size="12.5" text-anchor="middle" font-weight="700">GET /forecast</text>
  <text x="1073" y="411" fill="#8b949e" font-size="10.5" text-anchor="middle">port 8901</text>
  <path d="M968,398 L986,398" fill="none" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ah_7ee787)"/>
  <text x="28" y="452" fill="#8b949e" font-size="11" text-anchor="start">one cycle per finished capture file · capture with dumpcap -b duration:30 · the service itself needs no root</text>
