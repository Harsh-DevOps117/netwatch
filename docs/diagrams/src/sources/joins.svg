  <text x="28" y="40" fill="#e6edf3" font-size="20" text-anchor="start" font-weight="700">How the tables join</text>
  <text x="28" y="62" fill="#8b949e" font-size="13" text-anchor="start">per capture, packets reach flows only through the map · per day, every event table joins on event_id</text>
