  <text x="410" y="222" fill="#e3b341" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">flow_uid</text>
  <path d="M120,210 C120,300 490,300 490,210" fill="none" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g stroke="#ff7b72" stroke-width="2.4"><line x1="296" y1="276" x2="316" y2="296"/><line x1="316" y1="276" x2="296" y2="296"/></g>
  <text x="306" y="322" fill="#ff7b72" font-size="12" text-anchor="middle" font-weight="700">never join packets to flows on flow_key:</text>
  <text x="306" y="338" fill="#e6edf3" font-size="11" text-anchor="middle">CICFlowMeter closes and reopens a 5-tuple, so one key</text>
  <text x="306" y="353" fill="#e6edf3" font-size="11" text-anchor="middle">names many flows and rows multiply</text>
  <text x="40" y="392" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">packets.merge(flow_packet_map, on=&quot;frame_no&quot;)</text>
  <text x="40" y="410" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">       .merge(flows, on=&quot;flow_uid&quot;)</text>
  <text x="40" y="432" fill="#8b949e" font-size="10.5" text-anchor="start">the map comes from an interval join, so a packet&#x27;s label always equals its flow&#x27;s</text>
  <rect x="600" y="84" width="580" height="366" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="614" y="106" fill="#3fb950" font-size="13" text-anchor="start" font-weight="700">PER DAY</text>
