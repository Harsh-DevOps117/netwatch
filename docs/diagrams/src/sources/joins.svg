  <text x="432" y="208" fill="#8b949e" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">76 statistics</text>
  <path d="M200,183 L228,183" fill="none" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#ah_bc8cff)"/>
