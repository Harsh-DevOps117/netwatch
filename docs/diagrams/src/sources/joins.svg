<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">How the tables join</title>
  <desc id="d">Packets join the map on frame_no and the map joins flows on flow_uid. Joining packets to flows on flow_key is wrong, because CICFlowMeter reuses one 5-tuple key for many flows. Per day, events carry flow_uid back to flows, node ids map to IPs through that day&#x27;s node index, and every other event table joins on event_id. Links are keyed on the first packet&#x27;s sender, not on CICFlowMeter&#x27;s source.</desc>
