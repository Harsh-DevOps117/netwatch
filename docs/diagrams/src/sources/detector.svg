<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">Detector</title>
  <desc id="d">The detector reads h, 32 numbers from the flow encoder, and s, 100 numbers from the detection encoder. One head per day maps the 132 numbers through a hidden layer of 64 to one output per class. Thresholds are quantiles of benign scores on calibration rows at the chosen false-alarm budget; test labels are never used. An event alerts for a family when that family&#x27;s probability reaches its threshold; a host alerts after three such events in a row, and alerts with no quiet gap longer than 60 seconds form one incident.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="24%" cy="10%" r="55%"><stop offset="0%" stop-color="#e54d5e" stop-opacity="0.10"/><stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.05"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b949e" stroke-opacity="0.6" stroke-width="2"/></pattern>
    <marker id="ah_bc8cff" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="ah_58a6ff" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="ah_8b949e" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="ah_3fb950" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="ah_e6edf3" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker><marker id="ah_39c5bb" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#39c5bb"/></marker><marker id="ah_f778ba" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f778ba"/></marker><marker id="ah_e3b341" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker><marker id="ah_ff7b72" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0e14"/>
  <rect width="1200" height="470" fill="url(#grid)"/>
  <rect width="1200" height="470" fill="url(#glow)"/>
  <text x="28" y="40" fill="#e6edf3" font-size="20" text-anchor="start" font-weight="700">Detector</text>
  <text x="28" y="62" fill="#8b949e" font-size="13" text-anchor="start">names the attack family behind an event, with a probability, at a false-alarm budget the operator chooses</text>
  <rect x="44" y="150" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <rect x="44" y="162" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <rect x="44" y="174" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <rect x="44" y="186" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <rect x="44" y="198" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <rect x="44" y="210" width="12" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="50" y="140" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="700">h · 32</text>
  <text x="50" y="276" fill="#8b949e" font-size="10" text-anchor="middle">flow encoder</text>
  <rect x="114" y="150" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="162" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="174" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="186" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="198" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="210" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="222" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="234" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <rect x="114" y="246" width="12" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="1.3"/>
  <text x="120" y="140" fill="#bc8cff" font-size="12" text-anchor="middle" font-weight="700">s · 100</text>
  <text x="120" y="292" fill="#8b949e" font-size="10" text-anchor="middle">detection encoder</text>
  <path d="M136,205 L178,205" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <rect x="180" y="84" width="250" height="290" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="194" y="106" fill="#e3b341" font-size="13" text-anchor="start" font-weight="700">ONE HEAD PER DAY</text>
  <rect x="204" y="290" width="202" height="28" rx="14" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4"/>
  <text x="305" y="308" fill="#8b949e" font-size="11.5" text-anchor="middle" font-weight="700">concat [h, s] · 132</text>
  <rect x="204" y="246" width="202" height="28" rx="14" fill="#0b0e14" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="305" y="264" fill="#58a6ff" font-size="11.5" text-anchor="middle" font-weight="700">Linear 132 → 64</text>
  <path d="M305,288 L305,276" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <rect x="204" y="202" width="202" height="28" rx="14" fill="#0b0e14" stroke="#8b949e" stroke-width="1.4"/>
  <text x="305" y="220" fill="#8b949e" font-size="11.5" text-anchor="middle" font-weight="700">ReLU</text>
  <path d="M305,244 L305,232" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <rect x="204" y="158" width="202" height="28" rx="14" fill="#0b0e14" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="305" y="176" fill="#58a6ff" font-size="11.5" text-anchor="middle" font-weight="700">Linear 64 → classes</text>
  <path d="M305,200 L305,188" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <rect x="204" y="114" width="202" height="28" rx="14" fill="#0b0e14" stroke="#3fb950" stroke-width="1.4"/>
  <text x="305" y="132" fill="#3fb950" font-size="11.5" text-anchor="middle" font-weight="700">softmax → p(class)</text>
  <path d="M305,156 L305,144" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <text x="305" y="350" fill="#8b949e" font-size="10.5" text-anchor="middle">class 0 benign, then each family</text>
  <text x="305" y="364" fill="#8b949e" font-size="10.5" text-anchor="middle">trained on labelled training events</text>
  <path d="M430,150 L470,150" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah_8b949e)"/>
  <rect x="472" y="84" width="330" height="290" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="486" y="106" fill="#e3b341" font-size="13" text-anchor="start" font-weight="700">THRESHOLD PER FAMILY</text>
  <path d="M496,300 C530,300 540,160 580,150 C620,142 640,250 690,280 C720,292 760,296 780,298" fill="none" stroke="#3fb950" stroke-width="1.6"/>
  <line x1="496" y1="300" x2="784" y2="300" stroke="#6e7681"/>
  <line x1="742" y1="130" x2="742" y2="300" stroke="#e3b341" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="746" y="126" fill="#e3b341" font-size="13" text-anchor="start" font-weight="700">τ</text>
  <path d="M742,296 L742,300 L784,300 L784,298 C770,297 755,296 742,295 Z" fill="#ff7b72" fill-opacity="0.5"/>
  <text x="640" y="150" fill="#3fb950" font-size="11" text-anchor="middle">benign scores on</text>
  <text x="640" y="164" fill="#3fb950" font-size="11" text-anchor="middle">calibration rows</text>
  <text x="496" y="318" fill="#8b949e" font-size="10.5" text-anchor="start">score of the family →</text>
  <text x="490" y="340" fill="#e6edf3" font-size="11" text-anchor="start">τ per family = its benign quantile at the budget: 0.01%</text>
  <text x="490" y="355" fill="#e6edf3" font-size="11" text-anchor="start">(served), 0.1%, 1%, 5% · calibration = validation + 20% of</text>
  <text x="490" y="370" fill="#e6edf3" font-size="11" text-anchor="start">training kept back · test labels are never used</text>
  <rect x="822" y="84" width="358" height="290" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="836" y="106" fill="#ff7b72" font-size="13" text-anchor="start" font-weight="700">FROM SCORES TO INCIDENTS</text>
  <text x="836" y="118" fill="#8b949e" font-size="11" text-anchor="start">one host, events over time; filled = above τ</text>
  <circle cx="846" cy="150" r="6" fill="none" fill-opacity="0.7" stroke="#8b949e"/>
  <circle cx="870" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="894" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="918" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="942" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="966" cy="150" r="6" fill="none" fill-opacity="0.7" stroke="#8b949e"/>
  <circle cx="990" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="1014" cy="150" r="6" fill="none" fill-opacity="0.7" stroke="#8b949e"/>
  <circle cx="1038" cy="150" r="6" fill="none" fill-opacity="0.7" stroke="#8b949e"/>
  <circle cx="1062" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="1086" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="1110" cy="150" r="6" fill="#ff7b72" fill-opacity="0.7" stroke="#ff7b72"/>
  <circle cx="1134" cy="150" r="6" fill="none" fill-opacity="0.7" stroke="#8b949e"/>
  <path d="M918,164 L918,184" stroke="#ff7b72" stroke-width="1.4" marker-end="url(#ah_ff7b72)"/>
  <text x="926" y="180" fill="#e6edf3" font-size="11" text-anchor="start">3rd in a row → the host alerts</text>
  <rect x="846" y="206" width="150" height="22" rx="11" fill="#0b0e14" stroke="#ff7b72" stroke-width="1.4"/>
  <text x="921" y="221" fill="#ff7b72" font-size="11" text-anchor="middle" font-weight="700">incident 1</text>
  <rect x="1062" y="206" width="90" height="22" rx="11" fill="#0b0e14" stroke="#ff7b72" stroke-width="1.4"/>
  <text x="1107" y="221" fill="#ff7b72" font-size="11" text-anchor="middle" font-weight="700">incident 2</text>
  <text x="1029" y="256" fill="#8b949e" font-size="10.5" text-anchor="middle">quiet &gt; 60 s</text>
  <path d="M1000,238 L1058,238" stroke="#8b949e" stroke-dasharray="3 3"/>
  <text x="836" y="290" fill="#e6edf3" font-size="11.5" text-anchor="start">persistence: 3 consecutive events above τ</text>
  <text x="836" y="308" fill="#e6edf3" font-size="11.5" text-anchor="start">incident: alerts on one host with no quiet</text>
  <text x="836" y="324" fill="#e6edf3" font-size="11.5" text-anchor="start">gap longer than 60 s</text>
  <text x="836" y="352" fill="#8b949e" font-size="10.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">models/serving/emitter.py</text>
  <text x="28" y="420" fill="#e6edf3" font-size="12" text-anchor="start">Decision, per family: an alert when its probability reaches its own threshold at the served 0.01% budget, committed into the head as serve_threshold by the training script.</text>
  <text x="28" y="442" fill="#8b949e" font-size="11.5" text-anchor="start">The checkpoint stores the weights, the input scaler, the family names, thresholds per budget and the committed operating point.</text>
</svg>
