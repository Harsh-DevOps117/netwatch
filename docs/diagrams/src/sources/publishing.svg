<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">Publishing to Hugging Face</title>
  <desc id="d">From one training run, each trained stage is converted to safetensors with a config file, checked bit-identical to the original checkpoint, and staged under artifacts/huggingface/model, every detector head included; epoch and resume files are skipped. The event tables and the model&#x27;s per-event outputs are staged under artifacts/huggingface/dataset with one split per day. Both are uploaded with huggingface-cli; the dataset repository stays private and gated until its terms are checked.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="24%" cy="10%" r="55%"><stop offset="0%" stop-color="#e54d5e" stop-opacity="0.10"/><stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.05"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b949e" stroke-opacity="0.6" stroke-width="2"/></pattern>
    <marker id="ah_bc8cff" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="ah_58a6ff" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="ah_8b949e" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="ah_3fb950" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="ah_e6edf3" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker><marker id="ah_39c5bb" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#39c5bb"/></marker><marker id="ah_f778ba" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f778ba"/></marker><marker id="ah_e3b341" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker><marker id="ah_ff7b72" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0e14"/>
  <rect width="1200" height="470" fill="url(#grid)"/>
  <rect width="1200" height="470" fill="url(#glow)"/>
  <text x="28" y="40" fill="#e6edf3" font-size="20" text-anchor="start" font-weight="700">Publishing to Hugging Face</text>
  <text x="28" y="62" fill="#8b949e" font-size="13" text-anchor="start">one training run is staged as safetensors for the model repository and per-day tables for the dataset repository</text>
  <rect x="20" y="84" width="300" height="360" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="34" y="106" fill="#e6edf3" font-size="13" text-anchor="start" font-weight="700">ONE RUN · artifacts/current or --bundle</text>
  <text x="36" y="124" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b7/&lt;stem&gt;.pt</text>
  <text x="304" y="124" fill="#8b949e" font-size="11" text-anchor="end">flow encoder</text>
  <text x="36" y="148" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b8det/best.pt</text>
  <text x="304" y="148" fill="#8b949e" font-size="11" text-anchor="end">detection encoder</text>
  <text x="36" y="172" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b8/best.pt</text>
  <text x="304" y="172" fill="#8b949e" font-size="11" text-anchor="end">forecasting encoder</text>
  <text x="36" y="196" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">record_encoder.pt</text>
  <text x="304" y="196" fill="#8b949e" font-size="11" text-anchor="end">record encoder</text>
  <text x="36" y="220" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b9/best.pt</text>
  <text x="304" y="220" fill="#8b949e" font-size="11" text-anchor="end">compressor</text>
  <text x="36" y="244" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b10/best.pt</text>
  <text x="304" y="244" fill="#8b949e" font-size="11" text-anchor="end">world model</text>
  <text x="36" y="268" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b9live/, b10live/</text>
  <text x="304" y="268" fill="#8b949e" font-size="11" text-anchor="end">live pair, if trained</text>
  <text x="36" y="292" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">detector/head_&lt;day&gt;.pt</text>
  <text x="304" y="292" fill="#8b949e" font-size="11" text-anchor="end">every head</text>
  <text x="36" y="340" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">events, node_index, flow_records,</text>
  <text x="36" y="358" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">side_features, flow_embeddings,</text>
  <text x="36" y="376" fill="#e6edf3" font-size="11.5" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">latents</text>
  <text x="36" y="400" fill="#8b949e" font-size="11" text-anchor="start">tables for the same days and run</text>
  <line x1="36" y1="318" x2="304" y2="318" stroke="#30363d"/>
  <rect x="370" y="110" width="260" height="124" rx="8" fill="#0b0e14" stroke="#bc8cff" stroke-width="1.4"/>
  <text x="500.0" y="146.0" fill="#bc8cff" font-size="12" text-anchor="middle" font-weight="700">convert each checkpoint</text>
  <text x="500.0" y="161.0" fill="#e6edf3" font-size="11" text-anchor="middle">.pt → &lt;role&gt;.safetensors</text>
  <text x="500.0" y="176.0" fill="#8b949e" font-size="11" text-anchor="middle">+ &lt;role&gt;.config.json (names, widths,</text>
  <text x="500.0" y="191.0" fill="#8b949e" font-size="11" text-anchor="middle">thresholds, scalers)</text>
  <text x="500.0" y="206.0" fill="#8b949e" font-size="11" text-anchor="middle">every tensor checked bit-identical</text>
  <text x="500" y="256" fill="#8b949e" font-size="10.5" text-anchor="middle">why: loading a .pt unpickles it and can run code</text>
  <rect x="370" y="300" width="260" height="100" rx="8" fill="#0b0e14" stroke="#39c5bb" stroke-width="1.4"/>
  <text x="500.0" y="331.5" fill="#39c5bb" font-size="12" text-anchor="middle" font-weight="700">stage the tables</text>
  <text x="500.0" y="346.5" fill="#e6edf3" font-size="11" text-anchor="middle">one Hugging Face split per day</text>
  <text x="500.0" y="361.5" fill="#8b949e" font-size="11" text-anchor="middle">card inventory regenerated</text>
  <text x="500.0" y="376.5" fill="#8b949e" font-size="11" text-anchor="middle">--include / --days for a part</text>
  <path d="M320,200 L368,172" fill="none" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#ah_bc8cff)"/>
  <path d="M320,360 L368,350" fill="none" stroke="#39c5bb" stroke-width="1.5" marker-end="url(#ah_39c5bb)"/>
  <rect x="690" y="96" width="250" height="170" rx="8" fill="#0b0e14" stroke="#e3b341" stroke-width="1.4"/>
  <text x="815.0" y="132.5" fill="#e3b341" font-size="12" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">artifacts/huggingface/model</text>
  <text x="815.0" y="147.5" fill="#e6edf3" font-size="11" text-anchor="middle">flow_encoder · context_encoder</text>
  <text x="815.0" y="162.5" fill="#8b949e" font-size="11" text-anchor="middle">world_model_context_encoder</text>
  <text x="815.0" y="177.5" fill="#8b949e" font-size="11" text-anchor="middle">record_encoder · compressor · world_model</text>
  <text x="815.0" y="192.5" fill="#8b949e" font-size="11" text-anchor="middle">detector (--detector-day) · detector_&lt;day&gt;</text>
  <text x="815.0" y="207.5" fill="#8b949e" font-size="11" text-anchor="middle">live_compressor · live_world_model</text>
  <text x="815.0" y="222.5" fill="#8b949e" font-size="11" text-anchor="middle">each: .safetensors + .config.json</text>
  <text x="815.0" y="237.5" fill="#8b949e" font-size="11" text-anchor="middle">card, handler.py, inference.py</text>
  <rect x="690" y="290" width="250" height="120" rx="8" fill="#0b0e14" stroke="#39c5bb" stroke-width="1.4"/>
  <text x="815.0" y="324.0" fill="#39c5bb" font-size="12" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">artifacts/huggingface/dataset</text>
  <text x="815.0" y="339.0" fill="#e6edf3" font-size="11" text-anchor="middle">processed: events, node_index,</text>
  <text x="815.0" y="354.0" fill="#8b949e" font-size="11" text-anchor="middle">flow_records, side_features</text>
  <text x="815.0" y="369.0" fill="#8b949e" font-size="11" text-anchor="middle">model: flow_embeddings, latents</text>
  <text x="815.0" y="384.0" fill="#8b949e" font-size="11" text-anchor="middle">gated · private first</text>
  <path d="M630,172 L688,176" fill="none" stroke="#e3b341" stroke-width="1.5" marker-end="url(#ah_e3b341)"/>
  <path d="M630,350 L688,350" fill="none" stroke="#39c5bb" stroke-width="1.5" marker-end="url(#ah_39c5bb)"/>
  <rect x="1000" y="180" width="176" height="150" rx="14" fill="#0b0e14" stroke="#e6edf3" stroke-width="1.4"/>
  <text x="1088" y="214" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="700">Hugging Face Hub</text>
  <text x="1088" y="240" fill="#e6edf3" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">huggingface-cli upload</text>
  <text x="1088" y="262" fill="#e3b341" font-size="11" text-anchor="middle">model repository</text>
  <text x="1088" y="280" fill="#39c5bb" font-size="11" text-anchor="middle">dataset repository</text>
  <text x="1088" y="304" fill="#ff7b72" font-size="10.5" text-anchor="middle">check the licence first</text>
  <path d="M940,176 C962,176 962,230 984,230 L998,230" fill="none" stroke="#e3b341" stroke-width="1.5" marker-end="url(#ah_e3b341)"/>
  <path d="M940,350 C962,350 962,290 984,290 L998,290" fill="none" stroke="#39c5bb" stroke-width="1.5" marker-end="url(#ah_39c5bb)"/>
  <text x="28" y="460" fill="#8b949e" font-size="11" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">back to .pt, bit-exact:  uv run python tools/publish/to_safetensors.py world_model.pt --to-pt world_model</text>
</svg>
